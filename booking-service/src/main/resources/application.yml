server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/hotel_booking}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:2}
      minimum-idle: ${DB_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

app:
  messaging:
    reservation-created-queue: ${RESERVATION_CREATED_QUEUE:reservation.created}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
